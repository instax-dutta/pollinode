# Nosana deployment for PolliNode worker (vLLM serving Llama 3.1 8B)
# Deploy at https://deploy.nosana.com/deployments/create
#
# Budget discipline for the $70 hackathon credits:
#   - Simple strategy (bill only while running - NOT "infinite")
#   - replica count 1
#   - short container timeout: starts fresh when you need it
#   - stop the instance when idle, restart when hacking

image: vllm/vllm-openai:latest
strategy: SIMPLE
replicas: 1
containerTimeout: 3600
resources:
  gpu: true
  gpuMarket: nvidia-rtx-5090
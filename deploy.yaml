# PolliNode - deployment templates for the Decentralize AI Hackathon credits.
#
# Real Nosana schema: name / market / timeout / replicas / strategy / job_definition
# Market addresses: `nosana market list` (CLI) or explore.nosana.com -> pick by GPU name
#
# Budget discipline ($70 / RTX5090 ~$0.48/h, A100-80GB ~$0.90/h):
#   - strategy: SIMPLE  (bill only while running)
#   - replicas: 1
#   - long sessions (360-600 min) for model-download-heavy jobs
#   - stop deployment when idle; restart when hacking

name: pollinode-a100-distill
timeout: 360 # minutes = 6h session (60GB model download once + long generation run)
replicas: 1
strategy: SIMPLE
job_definition:
  version: "0.1"
  type: container
  meta:
    trigger: api
    system_requirements:
      required_vram: 80
  ops:
    - type: container/run
      id: llamacpp-sarvam
      args:
        image: ghcr.io/ggml-org/llama.cpp:server-cuda
        gpu: true
        expose: 8000
        cmd:
          - llama-server
          - --model
          - /models/sarvam-105b/sarvam-105b-q4_k_m.gguf
          - --host
          - "0.0.0.0"
          - --port
          - "8000"
          - --n-gpu-layers
          - "99"
          - --ctx-size
          - "4096"
        resources:
          - type: HF
            url: https://huggingface.co/sarvamai/sarvam-105b-gguf
            target: /models/sarvam-gguf

---
# Qwen-2.5-7B inference / LoRA serve (RTX 5090, 32GB) - the MVP demo artifact
name: pollinode-qwen-lora
timeout: 180
replicas: 1
strategy: SIMPLE
job_definition:
  version: "0.1"
  type: container
  meta:
    trigger: api
  ops:
    - type: container/run
      id: vllm-qwen-lora
      args:
        image: docker.io/vllm/vllm-openai:latest
        gpu: true
        expose: 8000
        cmd:
          - --model
          - Qwen/Qwen2.5-7B-Instruct
          - --max-model-len
          - "8192"
          - --served-model-name
          - "qwen2.5-7b"
        resources:
          - type: S3
            url: ""
            target: ""